[package]
name = "open-net"
# Development: `0.1.0-alpha.1`
# Public beta: `0.1.0-beta.1`, with bug fixes released as `beta.2`, `beta.3`, etc.
# Release candidate: `0.1.0-rc.1`
version = "0.1.0-beta.1"
edition = "2021"
description = "A cross-platform async networking library with WebSocket clients and network status monitoring."
license = "Apache-2.0"
repository = "https://github.com/0barman/open-net"
documentation = "https://docs.rs/open-net"
keywords = ["networking", "websocket", "async", "tokio", "cross-platform"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["http", "ws-client", "ws-server"]
http = ["dep:reqwest"]
ws-client = ["dep:tokio-tungstenite", "dep:tokio-util", "dep:socket2", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:httparse", "dep:base64"]
ws-server = []

[dependencies]
on-common = { version = "0.1.0", path = "../libs/common" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "io-util",
    "fs",
    "net",
] }
chrono = "0.4.45"
indexmap = "2.14.0"
lazy_static = "1.5.0"
if-addrs = "0.15.0"
n0-watcher = "=1.0.0-rc.0"
netwatch = "0.18.0"

reqwest = { version = "0.13.4", optional = true }
futures = "0.3.34"
bytes = "1.12.1"

tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
tokio-util = { version = "0.7.19", features = ["rt"], optional = true }
socket2 = { version = "0.6.2", optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws-lc-rs", "tls12"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"], optional = true }
webpki-roots = { version = "0.26.11", optional = true }
httparse = { version = "1.10.1", optional = true }
base64 = { version = "0.22.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Networking_NetworkListManager", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
networkframework = "=0.13.3"

[dev-dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
