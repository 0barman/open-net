[package]
name = "open-net"
# Development: `0.1.0-alpha.1`
# Public beta: `0.1.0-beta.1`, with bug fixes released as `beta.2`, `beta.3`, etc.
# Release candidate: `0.1.0-rc.1`
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "A cross-platform async networking library with WebSocket clients and network status monitoring."
license = "Apache-2.0"
repository = "https://github.com/0barman/open-net"
documentation = "https://docs.rs/open-net"
keywords = ["networking", "websocket", "async", "tokio", "cross-platform"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"
include = ["/src/**", "/libs/common/src/**", "/tests/**", "/examples/**", "/doc/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/rust-toolchain.toml", "/rustfmt.toml"]

[[example]]
name = "examples_messages"
required-features = ["ws-client"]

[[example]]
name = "examples_requests"
required-features = ["ws-client"]

[[example]]
name = "ws_client_lifecycle"
required-features = ["ws-client"]

[[example]]
name = "network_events"
required-features = ["net-status"]

[[example]]
name = "network_refresh"
required-features = ["net-status"]

[features]
default = ["ws-client"]
# Shared monitoring and LAN discovery. Transports enable this capability because
# their existing network observation and lifecycle contracts depend on it.
net-status = ["dep:if-addrs", "dep:n0-watcher", "dep:netwatch", "dep:windows", "dep:core-foundation", "dep:cc"]
ws-client = ["net-status", "tokio/net", "tokio/io-util", "futures-util/sink", "dep:tokio-tungstenite", "dep:tokio-util", "dep:socket2", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:httparse", "dep:base64", "dep:uuid", "dep:getrandom"]
http-client = ["net-status", "dep:chrono", "dep:async-trait", "dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:hyper", "dep:hyper-util", "dep:tower-service", "dep:tower-layer"]
# Optional RFC 6265 cookie storage for the HTTP client.  The store is SDK-owned
# and is deliberately not enabled by any default feature.
http-client-cookies = [
    "http-client",
    "dep:cookie",
    "dep:cookie_store",
    "dep:url",
    "dep:psl",
]
# Optional HTTP/2 negotiation and flow-control configuration.
http-client-http2 = ["http-client", "reqwest/http2", "hyper/http2", "hyper-util/http2"]
# SDK-owned middleware for concrete buffered and streaming HTTP calls.
http-client-middleware = ["http-client"]
# Dynamic HTTP authentication is opt-in and implies the HTTP client.  The
# base64 dependency is only needed for the static Basic provider.
http-client-auth = ["http-client", "dep:base64"]
http-client-codecs = ["http-client", "dep:serde_qs", "dep:getrandom"]

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
] }
chrono = { version = "0.4.45", default-features = false, features = ["now"], optional = true }
if-addrs = { version = "0.15.0", optional = true }
n0-watcher = { version = "=1.0.0-rc.0", optional = true }
netwatch = { version = "0.18.0", optional = true }

# The SDK uses Tokio for execution and only needs futures-util in production.
# Keep the futures facade, executor and polling macros in dev-dependencies.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12.1"
http = "1.5.0"

tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
tokio-util = { version = "0.7.19", features = ["rt"], optional = true }
socket2 = { version = "0.6.5", optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"], optional = true }
webpki-roots = { version = "1.0.9", optional = true }
httparse = { version = "1.10.1", optional = true }
base64 = { version = "0.22.1", optional = true }
uuid = { version = "1.26.1", default-features = false, features = ["std"], optional = true }
getrandom = { version = "0.3.4", features = ["std"], optional = true }

# http
async-trait = { version = "0.1.92", optional = true }
cookie = { version = "=0.18.2", default-features = false, optional = true }
cookie_store = { version = "=0.22.1", default-features = false, optional = true }
# Static Mozilla PSL: updated deliberately alongside Cookie behavior review.
psl = { version = "=2.1.240", optional = true }
url = { version = "2.5.7", optional = true }
serde_qs = { version = "1.1.3", default-features = false, optional = true }
reqwest = { version = "0.12.28", default-features = false, optional = true, features = [
    "stream",
    "rustls-tls-manual-roots-no-provider",
] }
hyper = { version = "1.11.1", default-features = false, optional = true, features = ["http1"] }
# These private typed-error compatibility boundaries are tied to the audited lock versions.
hyper-util = { version = "=0.1.20", default-features = false, optional = true, features = ["client-legacy", "client-proxy", "tokio"] }
tower-service = { version = "=0.3.3", optional = true }
tower-layer = { version = "=0.3.3", optional = true }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Networking_NetworkListManager", "Win32_System_Com", "Win32_System_Pipes", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10.1", optional = true }

[build-dependencies]
cc = { version = "1.4.4", optional = true }

[dev-dependencies]
ctor = "0.2.9"
rustls-openssl = { version = "=0.4.2", default-features = false, features = ["tls12"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "executor", "async-await"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
h2 = "0.4.19"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
